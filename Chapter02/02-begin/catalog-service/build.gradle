plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.14'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'eclipse'
}

group = 'com.polarbookshop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('printRuntimeClasspath') {
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

// NOTE: yes actually needed for build on save
// JDT (Java extension) compiles to Gradle output so DevTools + bootRun see changes.
// Resources must use Gradle's processResources output (build/resources/*), not
// build/classes/java/* — otherwise bootJar sees application.properties twice.
eclipse {
	classpath {
		baseSourceOutputDir = file('build/classes/java')
		file {
			whenMerged { classpath ->
				classpath.entries.findAll {
					it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder && it.path.endsWith('/resources')
				}.each { entry ->
					entry.output = entry.path.contains('test')
						? 'build/resources/test'
						: 'build/resources/main'
				}
			}
		}
	}
	synchronizationTasks processResources
}

